<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Briefje voorruit · Afleverproces BYD Groningen</title>
<link rel="stylesheet" href="css/huisstijl.css">
<style>
  @page { size: A5 landscape; margin: 0; }
  body { background: #e9e9ec; margin: 0; font-family: var(--font, "Sofia Pro", sans-serif); color: #000; }
  .knoppen { display: flex; gap: 8px; justify-content: center; padding: 16px; }
  .knoppen button { background: #282830; color: #fff; border: none; border-radius: 8px; padding: 10px 16px; font: inherit; font-weight: 700; cursor: pointer; }
  .vel { width: 210mm; height: 148mm; margin: 0 auto 24px; background: #fff; box-sizing: border-box; padding: 14mm 16mm; display: flex; flex-direction: column; border-top: 8mm solid #ca2222; }
  .boven { display: flex; justify-content: space-between; align-items: center; }
  .boven img { height: 11mm; }
  .boven .wat { font-size: 15pt; font-weight: 700; }
  .midden { display: flex; justify-content: space-between; align-items: flex-start; gap: 10mm; margin-top: 12mm; }
  .meldcode { text-align: right; }
  .meldcode .lbl { font-size: 13pt; font-weight: 700; }
  .meldcode .code { font-size: 64pt; font-weight: 800; letter-spacing: .02em; line-height: 1; }
  .datum { font-size: 44pt; font-weight: 800; letter-spacing: -.02em; line-height: 1; }
  .tijd { font-size: 22pt; font-weight: 700; margin-top: 3mm; }
  .klant { font-size: 30pt; font-weight: 800; margin-top: 9mm; }
  .auto { font-size: 15pt; font-weight: 600; margin-top: 2mm; }
  .onder { margin-top: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 6mm; border-top: 1px solid #000; padding-top: 5mm; }
  .onder .lbl { font-size: 11pt; font-weight: 600; }
  .onder .w { font-size: 20pt; font-weight: 800; margin-top: 1mm; }
  .onder .w.mc { color: #ca2222; }
  @media print { body { background: #fff; } .knoppen { display: none; } .vel { margin: 0; } }
</style>
</head>
<body>
<div class="knoppen"><button onclick="print()">Printen op A5</button></div>
<div id="vel"></div>
<script src="js/proces.js"></script>
<script src="js/demo-data.js"></script>
<script src="js/ui.js"></script>
<script>
  const o = laadOrders().find(x => x.id === new URLSearchParams(location.search).get("id"));
  const lang = iso => { const d = naarDatum(iso); return `${["zondag", "maandag", "dinsdag", "woensdag", "donderdag", "vrijdag", "zaterdag"][d.getDay()]} ${d.getDate()} ${["januari", "februari", "maart", "april", "mei", "juni", "juli", "augustus", "september", "oktober", "november", "december"][d.getMonth()]}`; };
  document.getElementById("vel").outerHTML = o ? `
    <div class="vel">
      <div class="boven"><img src="assets/adg-groep.svg" alt="ADG Groep"><span class="wat">Aflevering</span></div>
      <div class="midden">
        <div>
          <div class="datum">${o.afleverdatum ? lang(o.afleverdatum) : "Datum nog niet gepland"}</div>
          ${o.aflevertijd ? `<div class="tijd">${blokTekst(o.aflevertijd)} uur</div>` : ""}
        </div>
        <div class="meldcode"><div class="lbl">Meldcode</div><div class="code">${esc(meldcode(o) || "----")}</div></div>
      </div>
      <div class="klant">${esc(klantNaam(o))}</div>
      <div class="auto">${esc(autoNaam(o))}${o.auto.kenteken ? " · " + esc(o.auto.kenteken) : ""}</div>
      <div class="onder">
        <div><div class="lbl">Mastercare</div><div class="w ${o.mastercare ? "mc" : ""}">${o.mastercare ? "Ja" : "Nee"}</div></div>
        <div><div class="lbl">Verkoper</div><div class="w">${esc(o.verkoper)}</div></div>
      </div>
    </div>` : `<p style="text-align:center">Order niet gevonden.</p>`;
</script>
</body>
</html>
